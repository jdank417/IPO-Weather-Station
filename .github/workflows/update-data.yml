# Daily: fetch Cboe VIX term-structure histories, calibrate Heston (v0, kappa, theta)
# for every day, and commit the derived JSON in site/data/. The deploy workflow
# chains on this one's completion. Raw Cboe CSVs are never committed.

name: Update data

on:
  schedule:
    # Tue-Sat after the US close. Two runs because Cboe's CSV refresh time varies;
    # the second is a no-op when nothing changed.
    - cron: "23 1 * * 2-6"
    - cron: "17 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fetch, calibrate, export
        run: python -m pipeline.update

      - name: Commit changed data
        run: |
          if git diff --quiet -- site/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "data: update VIX term-structure fits ($(jq -r .date site/data/latest.json))"
          git push origin HEAD:main
